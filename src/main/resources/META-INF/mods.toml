modLoader = "javafml"
loaderVersion = "[47,)"
license = "PolyForm-Shield-1.0.0"
issueTrackerURL = "${sources}/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "${author}"
description = '''
${description}
'''
logoFile = "assets/${id}/icon.png"
displayURL = "${sources}"
displayTest = "IGNORE_ALL_VERSION"

[[mixins]]
config = "${id}.mixins.json"

[[dependencies.${id}]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft}"
ordering = "NONE"
side = "CLIENT"
